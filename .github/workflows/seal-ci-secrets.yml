name: dep-steward seal CI secrets

# A reusable workflow. The adopting repo's .github/workflows/dependabot-seal.yml
# calls it at a pinned commit of dep-steward, when /dep-steward:install
# dispatches it.
#
# GitHub runs a Dependabot pull request's workflows with Dependabot's own
# secret store, not the Actions one, so a CI that reads an Actions secret
# fails on every Dependabot PR and the gate never merges one. This run finds
# the secrets CI reads, seals each with the Dependabot store's public key, and
# prints only the sealed copy, which only GitHub can open. The install skill
# uploads that copy into the Dependabot store, so no person and no log ever
# holds a value.
#
# Reads: the CI workflow files, the secrets the caller passes (all of them,
# `secrets: inherit`, because which ones CI reads is only known here). Writes:
# sealed copies and names to its log. Does NOT touch any secret store.

on:
  workflow_call:
    inputs:
      ci-name:
        description: The exact `name:` of the CI workflow whose secrets Dependabot PRs need.
        type: string
        required: true
      public-key:
        description: The Dependabot secret store's public key (base64), from GET /repos/{repo}/dependabot/secrets/public-key.
        type: string
        required: true

permissions: {}

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (the CI workflow files)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: dep-steward's scripts, from this release
        uses: raphaelcm/dep-steward/actions/tools@cf80cd516168b1fe658da12f7d65c09ecbeaeaeb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libsodium's Python binding from Ubuntu's signed archive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-nacl

      - name: Seal each secret CI reads for the Dependabot store
        env:
          CI_NAME: ${{ inputs.ci-name }}
          DEPENDABOT_PUBLIC_KEY: ${{ inputs.public-key }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          case "$DEPENDABOT_PUBLIC_KEY" in ''|*[!A-Za-z0-9+/=]*) echo "::error::public-key is not base64"; exit 1 ;; esac
          SEAL_NAMES=$(node "$RUNNER_TEMP/dep-steward/ci-secrets.cjs" .)
          if [ -z "$SEAL_NAMES" ]; then
            echo "No workflow named '$CI_NAME' reads a secret, so there is nothing to seal."
          fi
          export SEAL_NAMES
          python3 - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ["DEPENDABOT_PUBLIC_KEY"])))
          secrets = json.loads(os.environ["ALL_SECRETS"])
          for name in os.environ["SEAL_NAMES"].split():
              value = secrets.get(name, "")
              if value:
                  sealed = base64.b64encode(box.encrypt(value.encode())).decode()
                  print("DEP-STEWARD-" + "SEALED", name, sealed)
              else:
                  print("DEP-STEWARD-" + "UNSET", name)
          PY
