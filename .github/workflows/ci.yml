name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shellcheck the installer
        run: shellcheck -s sh install.sh
      # Adopters lint the workflow this repo renders, so the tests lint it too
      # (test/actionlint.test.mjs). Checksummed by the Go module proxy.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run tests (gate logic, render parity, installer wiring, actionlint)
        env:
          REQUIRE_ACTIONLINT: '1'
        run: node --test test/*.test.mjs
