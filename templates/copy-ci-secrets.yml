name: dep-steward copies CI secrets for Dependabot

# Written by dep-steward's installer onto a branch of its own, whose one commit
# has no parent and holds only this file, so nothing else runs on the push. It
# runs once; the installer then deletes the branch and the run.
#
# GitHub runs a Dependabot pull request's workflows with Dependabot's own
# secret store, not the Actions one, so a CI that reads an Actions secret
# fails on every Dependabot PR and the gate never merges one. This run seals
# each secret CI reads with the Dependabot store's public key and prints only
# the sealed copy, which only GitHub can open. The installer uploads that copy
# into the Dependabot store, so no person and no log ever holds a value.

on:
  push:
    branches: ["__SEAL_BRANCH__"]

permissions: {}

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install libsodium's Python binding from Ubuntu's signed archive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-nacl

      - name: Seal each secret for the Dependabot store
        env:
          DEPENDABOT_PUBLIC_KEY: "__PUBLIC_KEY__"
          SEAL_NAMES: "__SEAL_NAMES__"
#__SEAL_ENV__
        run: |
          python3 - <<'PY'
          import base64, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ["DEPENDABOT_PUBLIC_KEY"])))
          for name in os.environ["SEAL_NAMES"].split():
              value = os.environ.get("SEAL_" + name, "")
              if value:
                  sealed = base64.b64encode(box.encrypt(value.encode())).decode()
                  print("DEP-STEWARD-" + "SEALED", name, sealed)
              else:
                  print("DEP-STEWARD-" + "UNSET", name)
          PY
