# dep-steward: copies the secrets CI reads into Dependabot's own secret store,
# sealed so no person or log sees a value. /dep-steward:install runs it; it
# does nothing on its own. The sealing step is dep-steward's, at the commit
# pinned below. It is handed, by name, each secret the CI workflow reads, and
# fails naming any it reads that this file does not pass.
name: Dependabot seal CI secrets

on:
  workflow_dispatch:
    inputs:
      public-key:
        description: The Dependabot secret store's public key (the install skill fills it in)
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: raphaelcm/dep-steward/actions/seal@3caa96d8a3d6b2d7cbe1954930b46e37306b0fc7 # v0.18.1
        with:
          ci-name: "__CI_NAME__"
          public-key: ${{ inputs.public-key }}
        env:
          SEAL___SECRET_NAME__: ${{ secrets.__SECRET_NAME__ }}
