# dep-steward: the deterministic gate that merges a Dependabot PR once CI is
# green (and, for a major or single bump, once the review says merge). It
# runs no agent. The pipeline itself lives in raphaelcm/dep-steward at the
# commit pinned below.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["__CI_NAME__", "Dependabot PR review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  gate:
    uses: raphaelcm/dep-steward/.github/workflows/automerge.yml@3caa96d8a3d6b2d7cbe1954930b46e37306b0fc7 # v0.18.1
    with:
      ci-name: "__CI_NAME__"
      assignee: "__ASSIGNEE__"
      autofix: true
